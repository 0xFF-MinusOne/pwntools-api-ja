name: 日本語版を公開する(GitHub Pages)

# 手元では pwntools を動かさず、Actions の中でだけ Sphinx で HTML を作る。
# 訳していない文は、原文(英語)のまま出る。
on:
  push:
    branches: [main]
    paths: ["locale/**", "PWNTOOLS_SHA", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pwntools を、決まったコミットで取得する
        run: |
          git clone --quiet https://github.com/Gallopsled/pwntools.git pwntools
          git -C pwntools checkout --quiet "$(cat PWNTOOLS_SHA)"
      - name: 依存を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r pwntools/docs/requirements.txt
          pip install -e ./pwntools
      - name: 日本語版の HTML を作る
        working-directory: pwntools/docs
        run: |
          sphinx-build -b html -D language=ja \
            -D locale_dirs="$GITHUB_WORKSPACE/locale" \
            source "$GITHUB_WORKSPACE/_site" 2>&1 | tail -30
      - name: 非公式の翻訳であることを、各ページの先頭に入れる
        run: |
          python3 - <<'PY'
          import pathlib, re
          banner = ('<div class="ja-notice">'
                    'これは pwntools ドキュメントの<strong>非公式の日本語訳</strong>です。'
                    '訳していない部分は英語のままです。原文: '
                    '<a href="https://docs.pwntools.com/">docs.pwntools.com</a><br>'
                    '読み物のドキュメント（インストール・はじめの一歩など）は、'
                    '<a href="https://0xff-minusone.github.io/pwntools-docs-ja/">Pwntools 公式ドキュメント（日本語訳）</a>、'
                    'チュートリアルは<a href="https://0xff-minusone.github.io/pwntools-tutorial-ja/">Pwntools チュートリアル（日本語訳）</a>にあります。<br>'
                    'Unofficial Japanese translation of the pwntools documentation (MIT License).</div>')
          # テーマ(sphinx_rtd_theme)の画面の文言。テーマに日本語がないので、できあがった HTML で置き換える
          plain = [
              ('placeholder="Search docs" aria-label="Search docs"', 'placeholder="ドキュメントを検索" aria-label="ドキュメントを検索"'),
              ('> View page source</a>', '> ページのソースを表示</a>'),
              ('</span> Previous</a>', '</span> 前へ</a>'),
              ('>Next <span class="fa fa-arrow-circle-right"', '>次へ <span class="fa fa-arrow-circle-right"'),
          ]
          built = re.compile(r'Built with <a href="([^"]+)">Sphinx</a> using a\s*<a href="([^"]+)">theme</a>\s*provided by <a href="([^"]+)">Read the Docs</a>\.')
          n = 0
          for p in pathlib.Path('_site').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              for old, new in plain:
                  s = s.replace(old, new)
              s = built.sub(r'<a href="\1">Sphinx</a> と、<a href="\3">Read the Docs</a> 提供の<a href="\2">テーマ</a>で作成しました。', s)
              # 左に固定されたサイドバーに隠れないよう、本文の欄(wy-nav-content)の先頭に入れる
              marker = '<div class="wy-nav-content">'
              if marker in s:
                  s = s.replace(marker, marker + banner, 1); n += 1
              depth = len(p.relative_to('_site').parts) - 1
              root = '../' * depth
              head = ''.join(f'<link rel="stylesheet" href="{root}_static/ja-docs/{f}">' for f in ('ja-docs.css', 'sphinx.css'))
              tail = ('<script>window.JaDocs={repo:"https://github.com/0xFF-MinusOne/pwntools-api-ja"};</script>'
                      + ''.join(f'<script src="{root}_static/ja-docs/{f}"></script>' for f in ('ja-docs.js', 'glossary-pwntools.js', 'glossary.js')))
              s = s.replace('</head>', head + '</head>', 1).replace('</body>', tail + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          print(n, 'ページに入れました')
          PY
          mkdir -p _site/_static/ja-docs && cp theme/*.css theme/*.js _site/_static/ja-docs/
          cp pwntools/LICENSE.md _site/LICENSE.txt 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
